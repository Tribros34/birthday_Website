services:
  app:
    build:
      context: .
    container_name: simay-birthday-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: simay-birthday-tunnel
    restart: unless-stopped
    depends_on:
      - app
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}
    command: tunnel --no-autoupdate run
